plugins {
    id 'java'
    id 'maven-publish'
}

group = 'io.github.togar2'
version = '1.1'

java.sourceCompatibility = 25
java.targetCompatibility = 25
compileJava.options.encoding = 'UTF-8'

var minestomCommit = "2025.12.20-1.21.11"

java {
    withJavadocJar()
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    compileOnly 'com.github.Minestom:Minestom:' + minestomCommit
    testImplementation 'com.github.Minestom:Minestom:' + minestomCommit
    //testImplementation 'com.github.TogAr2:MinestomFluids:b237b13a4b'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
